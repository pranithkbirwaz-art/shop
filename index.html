<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneShop — Universal Shopping</title>
  <style>
    :root{--p:#2874f0;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--ok:#168a42;--danger:#d92d20}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
    .nav{max-width:1250px;margin:auto;padding:12px 18px;display:flex;gap:14px;align-items:center}
    .logo{font-size:25px;font-weight:900;color:var(--p);white-space:nowrap}.logo span{color:#ff9f00}
    .search{flex:1;display:flex}.search input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px 0 0 10px;font-size:16px}
    button{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--p);color:#fff}.ghost{background:#eef3ff;color:var(--p)}
    .nav button{white-space:nowrap}.badge{background:#e53935;color:#fff;border-radius:99px;padding:2px 7px;font-size:11px}
    main{max-width:1250px;margin:auto;padding:22px 18px}.hero{background:linear-gradient(120deg,#2874f0,#7b61ff);color:#fff;border-radius:18px;padding:35px;margin-bottom:22px}
    .hero h1{margin:0 0 8px;font-size:clamp(30px,5vw,52px)}.hero p{margin:0;opacity:.92}
    .toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}
    .chip{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:99px;cursor:pointer}.chip.active{background:var(--p);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}.pic{height:205px;background:#eef2f7}.pic img{width:100%;height:100%;object-fit:cover}
    .info{padding:14px}.cat{font-size:11px;color:var(--p);font-weight:800;text-transform:uppercase}.title{font-size:17px;font-weight:800;margin:6px 0}.rating{color:#f59e0b}.price{font-size:21px;font-weight:900;margin:7px 0}.muted{color:var(--muted);font-size:13px}
    .offers{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.offer{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0}.seller{font-weight:800}.offerprice{font-weight:900}
    .drawer,.modal{position:fixed;z-index:30;background:#fff;box-shadow:0 0 35px #0002}.drawer{right:-430px;top:0;width:min(430px,100%);height:100%;transition:.25s;padding:20px;overflow:auto}.drawer.open{right:0}
    .modal{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(520px,92%);max-height:90vh;overflow:auto;padding:24px;border-radius:16px;display:none}.modal.show{display:block}
    .overlay{position:fixed;inset:0;background:#0008;z-index:25;display:none}.overlay.show{display:block}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.form{display:grid;gap:11px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px}
    .cartitem{display:flex;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.cartitem img{width:65px;height:65px;object-fit:cover;border-radius:8px}.qty{display:flex;gap:7px;align-items:center;margin-top:7px}
    .admin{display:none}.admin.show{display:block}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;padding:18px;border:1px solid var(--line);border-radius:14px}.stat b{font-size:28px;display:block}
    table{width:100%;border-collapse:collapse;background:#fff;margin-top:16px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:14px}
    .hidden{display:none!important}.error{color:var(--danger)}.success{color:var(--ok)}
    @media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
    @media(max-width:460px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="nav">
  <div class="logo">One<span>Shop</span></div>
  <div class="search"><input id="search" placeholder="Search once across all connected stores…"><button class="primary" onclick="searchProducts()">Search</button></div>
  <button class="ghost" onclick="openAuth()">Account</button>
  <button class="ghost" onclick="openCart()">🛒 <span id="cartCount" class="badge">0</span></button>
  <button class="ghost" onclick="showAdmin()">Admin</button>
</div></header>

<main id="shop">
  <section class="hero"><h1>One search. Many stores.</h1><p>Compare products and offers from connected marketplaces in one place.</p></section>
  <div class="filters" id="filters"></div>
  <div class="toolbar"><b id="count">Products</b><select id="sort" onchange="render()"><option value="best">Best match</option><option value="low">Lowest price</option><option value="high">Highest price</option></select></div>
  <section class="grid" id="products"></section>
</main>

<main id="admin" class="admin">
  <div class="row"><div><h1>Admin dashboard</h1><p class="muted">Manage products and marketplace offers.</p></div><button onclick="hideAdmin()">Back to shop</button></div>
  <div class="statgrid"><div class="stat">Products<b id="sProducts">0</b></div><div class="stat">Offers<b id="sOffers">0</b></div><div class="stat">Cart items<b id="sCart">0</b></div><div class="stat">Orders<b id="sOrders">0</b></div></div>
  <div class="card" style="margin-top:16px;padding:18px">
    <h2>Add product</h2>
    <form class="form" onsubmit="addProduct(event)">
      <input id="pname" required placeholder="Product name"><input id="pcat" required placeholder="Category"><input id="pprice" required type="number" min="0" placeholder="Your price"><input id="pimage" placeholder="Image URL"><textarea id="pdesc" placeholder="Description"></textarea><button class="primary">Save product</button>
    </form>
  </div>
  <div id="adminTable"></div>
</main>

<div id="overlay" class="overlay" onclick="closePanels()"></div>
<aside id="cart" class="drawer"><div class="row"><h2>🛒 Cart</h2><button onclick="closePanels()">✕</button></div><div id="cartItems"></div><hr><div class="row"><b>Total</b><b id="cartTotal">₹0</b></div><button class="primary" style="width:100%;margin-top:12px" onclick="checkout()">Checkout</button></aside>

<div id="auth" class="modal"><button style="float:right" onclick="closePanels()">✕</button><h2 id="authTitle">Login</h2><form class="form" onsubmit="authSubmit(event)"><input id="email" type="email" required placeholder="Email"><input id="password" type="password" required placeholder="Password"><button class="primary">Continue</button></form><p id="authMsg"></p><button class="ghost" onclick="toggleAuth()">Switch signup/login</button></div>

<div id="checkout" class="modal"><button style="float:right" onclick="closePanels()">✕</button><h2>Checkout</h2><form class="form" onsubmit="placeOrder(event)"><input id="name" required placeholder="Full name"><input id="phone" required placeholder="Phone"><textarea id="address" required placeholder="Delivery address"></textarea><select id="payment"><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select><button class="primary">Place order</button></form><p id="checkoutMsg"></p></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Replace these two values with your Supabase project values. */
const SUPABASE_URL = "https://bnahcomgvyfingbifalw.supabase.co";
const SUPABASE_KEY = "sb_publishable_7sReQunUQ06z74VzcehQwA_xzBSzQX9";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let products=[], offers=[], cart=[], categories=[], authMode="login", user=null;

const money = n => "₹"+Number(n||0).toLocaleString("en-IN");
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function boot(){
  if(SUPABASE_URL.startsWith("YOUR_")) {
    document.getElementById("products").innerHTML='<div class="card" style="padding:25px;grid-column:1/-1"><b>Connect Supabase first.</b><p class="muted">Open this file and replace SUPABASE_URL and SUPABASE_KEY.</p></div>';
    return;
  }
  const session = (await supabase.auth.getSession()).data.session;
  user=session?.user||null;
  await loadAll(); await loadCart(); render();
  supabase.auth.onAuthStateChange(async (_e,s)=>{user=s?.user||null; await loadCart(); render();});
  supabase.channel("live-products").on("postgres_changes",{event:"*",schema:"public",table:"products"},loadAll).subscribe();
  supabase.channel("live-offers").on("postgres_changes",{event:"*",schema:"public",table:"marketplace_offers"},loadAll).subscribe();
}
async function loadAll(){
  const p=await supabase.from("products").select("*").eq("active",true).order("created_at",{ascending:false});
  const o=await supabase.from("marketplace_offers").select("*").order("price",{ascending:true});
  products=p.data||[]; offers=o.data||[];
  categories=[...new Set(products.map(x=>x.category).filter(Boolean))];
  document.getElementById("filters").innerHTML='<button class="chip active" onclick="filterCat(\'\')">All</button>'+categories.map(c=>`<button class="chip" onclick="filterCat('${esc(c)}')">${esc(c)}</button>`).join("");
  adminRefresh();
}
async function loadCart(){
  cart=[];
  if(!user){document.getElementById("cartCount").textContent="0";return;}
  const r=await supabase.from("cart_items").select("id,product_id,quantity,products(*)").eq("user_id",user.id).order("created_at");
  cart=r.data||[]; document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.quantity,0); adminRefresh();
}
let cat="";
window.filterCat=c=>{cat=c;render()};
window.searchProducts=()=>render();
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase(), sort=document.getElementById("sort").value;
  let list=products.filter(p=>(!cat||p.category===cat)&&(!q||(p.name+" "+(p.category||"")+" "+(p.description||"")).toLowerCase().includes(q)));
  if(sort==="low") list.sort((a,b)=>a.price-b.price); if(sort==="high") list.sort((a,b)=>b.price-a.price);
  document.getElementById("count").textContent=list.length+" products";
  document.getElementById("products").innerHTML=list.length?list.map(card).join(""):'<div class="card" style="padding:30px;grid-column:1/-1">No products found.</div>';
}
function card(p){
  const os=offers.filter(o=>o.product_id===p.id).sort((a,b)=>a.price-b.price);
  return `<article class="card"><div class="pic"><img src="${esc(p.image_url||'https://placehold.co/700x500?text=Product')}" onerror="this.src='https://placehold.co/700x500?text=Product'"></div><div class="info"><div class="cat">${esc(p.category)}</div><div class="title">${esc(p.name)}</div><div class="rating">★★★★★ <span class="muted">${p.rating||''}</span></div><div class="price">${money(p.price)}</div><div class="muted">${esc(p.description||'')}</div><div class="offers"><b>Compare stores</b>${os.length?os.slice(0,5).map(o=>`<div class="offer"><span class="seller">${esc(o.marketplace)}</span><span class="offerprice">${money(o.price)}</span><button class="ghost" onclick="buyOffer('${esc(o.buy_url||'')}')">Buy</button></div>`).join(""):'<div class="muted">No connected marketplace offer yet.</div>'}</div><button class="primary" style="width:100%;margin-top:10px" onclick="addCart('${p.id}')">Add to my cart</button></div></article>`;
}
window.buyOffer=url=>{if(url)location.href=url;else alert("This marketplace offer has no authorized buying link yet.")};
window.addCart=async id=>{
 if(!user){openAuth();return}
 const old=cart.find(x=>x.product_id===id);
 const q=(old?.quantity||0)+1;
 const {error}=await supabase.from("cart_items").upsert({user_id:user.id,product_id:id,quantity:q},{onConflict:"user_id,product_id"});
 if(error) alert(error.message); else await loadCart();
};
window.openCart=()=>{document.getElementById("cart").classList.add("open");document.getElementById("overlay").classList.add("show");renderCart()};
function renderCart(){
 document.getElementById("cartItems").innerHTML=cart.length?cart.map(x=>`<div class="cartitem"><img src="${esc(x.products?.image_url||'https://placehold.co/100')}"><div style="flex:1"><b>${esc(x.products?.name||'Product')}</b><div>${money(x.products?.price)} × ${x.quantity}</div><div class="qty"><button onclick="changeQty('${x.id}',${x.quantity-1})">−</button><span>${x.quantity}</span><button onclick="changeQty('${x.id}',${x.quantity+1})">+</button></div></div></div>`).join(""):'<p class="muted">Your live cart is empty.</p>';
 document.getElementById("cartTotal").textContent=money(cart.reduce((s,x)=>s+(x.products?.price||0)*x.quantity,0));
}
window.changeQty=async(id,q)=>{if(q<=0)await supabase.from("cart_items").delete().eq("id",id);else await supabase.from("cart_items").update({quantity:q}).eq("id",id);await loadCart();renderCart()};
window.openAuth=()=>{document.getElementById("auth").classList.add("show");document.getElementById("overlay").classList.add("show")};
window.toggleAuth=()=>{authMode=authMode==="login"?"signup":"login";document.getElementById("authTitle").textContent=authMode==="login"?"Login":"Create account";document.getElementById("authMsg").textContent=""};
window.authSubmit=async e=>{e.preventDefault();const email=document.getElementById("email").value,password=document.getElementById("password").value;let r=authMode==="login"?await supabase.auth.signInWithPassword({email,password}):await supabase.auth.signUp({email,password});document.getElementById("authMsg").textContent=r.error?r.error.message:"Success. Check your email if confirmation is enabled.";if(!r.error&&r.data.session)closePanels()};
window.checkout=()=>{if(!cart.length)return;document.getElementById("checkout").classList.add("show");document.getElementById("overlay").classList.add("show")};
window.placeOrder=async e=>{e.preventDefault();if(!user)return;const total=cart.reduce((s,x)=>s+(x.products?.price||0)*x.quantity,0);const r=await supabase.from("orders").insert({user_id:user.id,customer_name:document.getElementById("name").value,phone:document.getElementById("phone").value,address:document.getElementById("address").value,payment_method:document.getElementById("payment").value,total,status:"pending"}).select().single();if(r.error){document.getElementById("checkoutMsg").textContent=r.error.message;return}await supabase.from("cart_items").delete().eq("user_id",user.id);await loadCart();document.getElementById("checkoutMsg").textContent="Order placed.";};
window.closePanels=()=>{document.querySelectorAll(".modal").forEach(x=>x.classList.remove("show"));document.getElementById("cart").classList.remove("open");document.getElementById("overlay").classList.remove("show")};
window.showAdmin=async()=>{if(!user){openAuth();return}const p=await supabase.from("profiles").select("role").eq("id",user.id).single();if(p.data?.role!=="admin"){alert("Admin account required.");return}document.getElementById("shop").style.display="none";document.getElementById("admin").classList.add("show");adminRefresh()};
window.hideAdmin=()=>{document.getElementById("admin").classList.remove("show");document.getElementById("shop").style.display="block"};
window.addProduct=async e=>{e.preventDefault();const r=await supabase.from("products").insert({name:document.getElementById("pname").value,category:document.getElementById("pcat").value,price:Number(document.getElementById("pprice").value),image_url:document.getElementById("pimage").value,description:document.getElementById("pdesc").value}).select();if(r.error)alert(r.error.message);else{e.target.reset();await loadAll();render()}};
async function adminRefresh(){document.getElementById("sProducts").textContent=products.length;document.getElementById("sOffers").textContent=offers.length;document.getElementById("sCart").textContent=cart.reduce((a,x)=>a+x.quantity,0);if(user){const r=await supabase.from("orders").select("id",{count:"exact",head:true});document.getElementById("sOrders").textContent=r.count||0}document.getElementById("adminTable").innerHTML='<table><tr><th>Product</th><th>Price</th><th>Category</th><th>Active</th></tr>'+products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${esc(p.category)}</td><td>${p.active?'Yes':'No'}</td></tr>`).join("")+'</table>'}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")render()});
boot();
</script>
</body>
</html>
